<!doctype html>
<html>
<head>
  <title>Rotating Star Reels</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="reels.css" rel="stylesheet" type="text/css"/>
  <script src="reels.js" type="text/javascript"> </script>
</head>
<body>
  <p>Rotating Star Reels</p>
  <canvas width="256" height="192" style="width:256px; height:192px; image-rendering: crisp-edges;"></canvas>
  <script type="x-shader/x-vertex" id="vertex-shader">
#version 100
precision highp float;

attribute vec2 a_Position;

void main() {
  gl_Position = vec4(a_Position, 0.0, 1.0);
}
  </script>
  <script type="x-shader/x-fragment" id="fragment-shader">
#version 100
precision highp float;
precision mediump float;

void main() {
  gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
}
  </script>
</body>
</html>
